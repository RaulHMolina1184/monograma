<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monograma — En construcción</title>
<meta name="description" content="Nuestro sitio está en proceso de construcción.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --ink: #f5f5f2;
    --muted: #8a8a86;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 8vw 6vw;
    text-align:center;
  }

  .stage{
    width:100%;
    max-width: 640px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .message{
    font-weight: 600;
    font-size: clamp(22px, 4.4vw, 36px);
    line-height: 1.3;
    letter-spacing: -0.01em;
    margin-bottom: clamp(36px, 6vw, 56px);
  }

  .countdown{
    display:flex;
    gap: clamp(14px, 3.5vw, 34px);
  }

  .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width: 56px;
  }

  .unit .value{
    font-family:'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: clamp(28px, 6vw, 48px);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .unit .label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 8px;
  }

  .sep{
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(28px, 6vw, 48px);
    color: var(--muted);
    align-self:flex-start;
    padding-top: 2px;
  }

  @media (max-width: 420px){
    .countdown{ gap: 10px; }
    .unit{ min-width: 46px; }
  }
</style>
</head>
<body>

  <main class="stage">
    <p class="message">
      Nuestro sitio está en proceso de construcción. <br><br>
      ¡Pronto nos veremos!
    </p>

    <div class="countdown" id="countdown" aria-live="polite">
      <div class="unit"><span class="value" id="days">00</span><span class="label">Días</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="value" id="hours">00</span><span class="label">Horas</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="value" id="minutes">00</span><span class="label">Min</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="value" id="seconds">00</span><span class="label">Seg</span></div>
    </div>
  </main>

  <script>
    // EDITA esta fecha con el lanzamiento real (formato ISO, zona horaria de Costa Rica -06:00)
    const TARGET_DATE = new Date("2026-10-17T00:00:00-06:00");

    const els = {
      d: document.getElementById('days'),
      h: document.getElementById('hours'),
      m: document.getElementById('minutes'),
      s: document.getElementById('seconds'),
    };

    function pad(n){ return String(n).padStart(2, '0'); }

    function tick(){
      const now = new Date();
      let diff = Math.max(0, TARGET_DATE - now);

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      els.d.textContent = pad(days);
      els.h.textContent = pad(hours);
      els.m.textContent = pad(minutes);
      els.s.textContent = pad(seconds);
    }

    tick();
    setInterval(tick, 1000);
  </script>

</body>
</html>
